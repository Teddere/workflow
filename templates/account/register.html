{% load static %}
<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Créer | workflow</title>
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>
    <body class="bg-zinc-100 text-zinc-900 antialiased">
        <main class="flex min-h-screen items-center justify-center p-5">
            <form method="post" class="w-full max-w-md space-y-4 rounded-2xl bg-white p-8 shadow-sm">
                {% csrf_token %}
                <h1 class="text-2xl font-bold">Créer un compte</h1>
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="mb-1 block text-sm">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% for error in field.errors %}
                            <p class="text-xs text-red-600">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
            <button class="w-full rounded-xl bg-zinc-900 p-3 text-white cursor-pointer">
                S'inscrire
            </button>
                <a href="{% url 'account:login' %}" class="block text-center text-sm underline">
                    Se connecter
                </a>
            </form>
        </main>
    </body>
</html>
