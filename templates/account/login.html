{% load static %}
<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Connexion | workflow</title>
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>
    <body class="bg-zinc-100 text-zinc-900 antialiased">
        <main class="flex min-h-screen items-center justify-center p-5">
            <form  method="post" class="w-full max-w-md space-y-5 rounded-2xl bg-white p-8 shadow-sm">
                {% csrf_token %}
                <h1 class="text-2xl font-bold">Connexion</h1>
                {% if messages %}
                    {% for message in messages %}
                        <p class="text-sm text-red-600">{{ message.message }}</p>
                    {% endfor %}
                {% endif %}
                {% for field in form  %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="mb-1 block text-sm">
                            {{ field.label }}
                        </label>
                        {{ field }}
                    </div>
                {% endfor %}
                <div>
                    <button type="submit" class="w-full rounded-xl bg-zinc-900 p-3 text-white cursor-pointer">
                        Se connecter
                    </button>
                    <p class="block text-center text-sm my-2">
                        Pas de compte ?
                        <a class="underline" href="{% url 'account:register' %}">S'inscrire</a>
                    </p>
                </div>
            </form>
        </main>
    </body>
</html>
