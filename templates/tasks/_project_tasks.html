<div id="project-task-list" 
     hx-get="{% url 'tasks:project-task-list' project.pk %}" 
     hx-trigger="taskCreated from:body" 
     hx-swap="outerHTML" 
     class="w-full py-3 border-t border-zinc-300"
>
    <div class="flex justify-between items-center pb-3">
        <h3 class="text-base font-semibold">Tâches du projet</h3>
        {% with task_count=project.tasks.count %}
            <span class="text-xs text-zinc-500">
                {{ task_count }} {% if task_count > 1 %}tâches{% else %}tâche{% endif %}
            </span>
        {% endwith %}
    </div>
    {% for task in project.tasks.all %}
                {% include 'tasks/_task_list.html' with task=task %}
            {% empty %}
                <p class="text-sm text-zinc-500 text-center">Aucune tâche pour ce projet</p>
            {% endfor %}
</div>
