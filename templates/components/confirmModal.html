<div id="modal-box" class="pointer-events-none fixed inset-0 z-50 grid h-screen w-screen place-items-center bg-black/60 opacity-0 backdrop-blur-sm transition-opacity duration-300">

    <div id="modal-content" class="relative m-4 p-4 rounded-lg bg-white shadow-sm">
        <div class="flex items-center pb-4 text-lg font-medium text-zinc-700">
            Confirmation
        </div>
        <div class="relative border-t border-zinc-200 py-4 leading-normal text-zinc-800 font-light">
            Voulez-vous vraiment supprimer <b>{{ project.title }}</b> ?<br>
            <small class="text-zinc-700">Cette action est irréversible.</small>
        </div>
        <div class="flex gap-4 flex-wrap items-center pt-4 justify-end">
            <form action="{% url 'projects:delete' project.pk %}" method="post">
                {% csrf_token %}
                <button type="button"
                        id="close-modal-btn"
                    class="cursor-pointer rounded-md bg-white py-2 px-4 border border-zinc-300 text-center text-sm text-zinc-800 transition-all shadow-md"
                >
                    Annuler
                </button>
                <button type="submit"
                    class="cursor-pointer rounded-md bg-red-800 py-2 px-4 border border-transparent text-center text-sm text-white transition-all shadow-md"
                >
                    Supprimer
                </button>
            </form>
        </div>
    </div>
</div>
