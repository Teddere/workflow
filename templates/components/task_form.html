<div class="grid grid-cols-1 gap-4 py-3 md:grid-cols-2 mb-1">
    {% for field in form %}
        <div class="flex flex-col gap-2 {% if field.name == 'title' or field.name == 'description'  %}md:col-span-2{% endif %}">
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-zinc-700">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
                {{ field.errors }}
            {% endif %}
        </div>
    {% endfor %}
</div>
