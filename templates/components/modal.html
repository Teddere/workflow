<div id="modal" class="pointer-events-none fixed inset-0 z-50 grid h-screen w-screen place-items-center overflow-y-auto bg-black/60 opacity-0 backdrop-blur-sm transition-opacity duration-300">
    <div id="modal-content" class="modal-box relative m-4 p-4 w-2/4 rounded-lg bg-white opacity-0 scale-95 shadow-sm transition-all duration-300">
        <div class="flex justify-between items-center pb-2 ">
            <h4  class="modal-title text-base font-medium text-zinc-700">{{ modalTitle }}</h4>
            <button type="button" 
                    class="inline-block py-1.5 px-2 border border-zinc-300 text-zinc-400 rounded-lg text-lg text-center align-middle hover:border-zinc-700 hover:text-zinc-800 cursor-pointer transition-colors duration-300"
                    data-modal-close="modal"
            >
                <i class="bx bx-x"></i>
            </button>
        </div>
        <!-- form content -->
        <div id="form-modal" class="border-t border-zinc-200 py-2"></div>

        <div class="flex gap-4 justify-end flex-wrap items-center pt-2">
            <button type="button"
                    data-modal-close="modal"
                    class="cursor-pointer rounded-md bg-white py-2 px-4 border border-zinc-300 text-center text-sm text-zinc-800 transition-all shadow-md"
            >
                Annuler
            </button>
            <button type="submit"
                    id="modal-submit-btn"
                    class="cursor-pointer rounded-md bg-zinc-800 py-2 px-4 border border-transparent text-center text-sm text-white transition-all shadow-md duration-300"
            >
                Valider
            </button>
        </div>
    </div>
</div>
