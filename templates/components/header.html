<header class="flex h-20 items-center justify-between gap-3 border-b border-zinc-100 px-4  md:px-6">
    <div class="flex items-center gap-3">
        <button type="button" data-sidebar-toggle aria-controls="sidebar" aria-expanded="false" class="rounded-lg text-lg border px-3 py-2 lg:hidden">
            <i class='bx bx-menu'></i>
        </button>
        <div>
            <p class="text-xs text-zinc-500">Bienvenue</p>
            <p class="font-semibold">John Doe</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <form action="#" method="get" class="hidden sm:block">
            <input type="search" name="q" id="search" placeholder="Rechercher une tâche..."
            class="w-56 rounded-xl border border-zinc-200 px-3 py-2 text-sm outline-none focus:border-zinc-500"
            >
        </form>
        <a href="#" class="flex size-9 items-center justify-center rounded-full bg-zinc-200 text-sm font-semibold">
            {{ username |first|upper }}
        </a>
        <div class="absolute right-0 top-full mt-3 w-64 overflow-hidden rounded-2xl border-2 border-white bg-zinc-200">
            <div class="">
                <span class="">{{ request.user.get_full_name|default:request.user.username }}</span>
                <span class="">{{ request.user.email }}</span>
            </div>
            <div class="">
                <a href="#" class="">
                    <i class='bx bx-user'></i>
                    Profile
                </a>
                <a href="#" class="">
                    <i class='bx bx-user'></i>
                    Profile
                </a>
            </div>

        </div>
       <!-- <button type="button" class="relative inline-flex justify-center items-center shrink-0 size-9 bg-clib-padding border border-transparent rounded-full">
            <span class="">R</span>
        </button>-->
    </div>
</header>
