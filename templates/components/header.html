<header class="flex h-20 items-center justify-between gap-3 border-b border-zinc-100 px-4  md:px-6">
    <div class="flex items-center gap-3">
        <button type="button" data-sidebar-toggle aria-controls="sidebar" aria-expanded="false" class="rounded-lg text-lg border px-3 py-2 lg:hidden">
            <i class='bx bx-menu'></i>
        </button>
        <div>
            <p class="text-xs text-zinc-500">Bienvenue</p>
            <p class="font-semibold">John Doe</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <form action="#" method="get" class="hidden sm:block">
            <input type="search" name="q" id="search" placeholder="Rechercher une tâche..."
            class="w-56 rounded-xl border border-zinc-200 px-3 py-2 text-sm outline-none focus:border-zinc-500"
            >
        </form>
        <div class="relative">
            <button id="btn-profile-menu" type="button" aria-controls="profile-box" aria-expanded="false" class="fex size-9 items-center justify-center rounded-full cursor-pointer  bg-zinc-200 text-zinc-700 text-sm font-semibold">
                {{ request.user.username|first|upper  }}
            </button>
            <div id="profile-menu" class="hidden absolute right-0 z-50 top-full mt-3 w-64 overflow-hidden border border-zinc-200 rounded-2xl bg-white shadow-xl shadow-zinc-900/10 transition-all duration ease-in-out opacity-0 scale-95 -translate-y-2">
                <div class="border-b border-zinc-100 px-4 py-3">
                    <span class="truncate text-sm font-semibold">{{ request.user.get_full_name|default:request.user.username }}</span>
                    <span class="truncate text-xs text-zinc-500">{{ request.user.email }}</span>
                </div>
                <div class="p-1.5">
                    <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-zinc-700 hover:bg-zinc-100">
                        <i class="bx bx-user"></i>
                        Profile
                    </a>
                    <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-zinc-700 hover:bg-zinc-100">
                        <i class="bx bx-cog"></i>
                        Paramètres
                    </a>
                </div>
                <div class="border-t border-zinc-100 p-1.5">
                    <form action="{% url 'account:logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="flex w-full items-center gap-3 cursor-pointer rounded-lg px-3 py-2.5 text-left text-sm font-medium text-red-600 hover:bg-red-50">
                            <i class='bx bx-log-out'></i>
                            Se déconnecter
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
