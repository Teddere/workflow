{% extends 'base.html' %}
{% block title %}Création{% endblock title %}

{% block content %}
    <div class="mx-auto rounded-md space-y-5 p-6 shadow-md  border border-zinc-200">
        <div class="pb-5 border-b border-zinc-300">
            <h1 class="text-lg font-semibold">Nouveau projet</h1>
        </div>

        <form  method="post">
            {% csrf_token %}
            {% include 'components/project_form.html' %}

            <div class="mb-5 text-end">
                <button type="submit"
                        class="cursor-pointer rounded-md bg-zinc-800 py-2 px-4 border border-transparent text-center text-sm text-white transition-all shadow-md focus:bg-zinc-700 focus:shadow-none w-full md:w-auto"
                >
                    Enregistrer
                </button>
            </div>
        </form>

    </div>
{% endblock content %}
